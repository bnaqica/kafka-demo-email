# Points at the stacks in the local-docker repo (mongoDB/, kafka/ and keycloak/). Requires tokens like every profile.
spring:
  mongodb:
    uri: mongodb://kafka_demo_email_local:local@localhost:27017/kafka_demo_email_db?authSource=kafka_demo_email_db
  kafka:
    bootstrap-servers: localhost:9092
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/kafka-demo   # the local-docker Keycloak
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
